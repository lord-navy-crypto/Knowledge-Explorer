<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Project</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    .card {
      width: min(92vw, 620px);
      padding: 42px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 18px 50px rgba(20, 35, 70, .12);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 42px; }
    p { color: #5b6475; line-height: 1.6; }
    button {
      margin-top: 18px;
      padding: 13px 22px;
      border: 0;
      border-radius: 12px;
      background: #172033;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { transform: translateY(-1px); }
    #message { min-height: 28px; margin-top: 22px; font-weight: 600; }
    code {
      display: inline-block;
      margin-top: 18px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #eef2f7;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>My First Project 🚀</h1>
    <p>
      This page was created directly in my GitHub repository.
      It is a tiny interactive playground — a starting point for bigger ideas.
    </p>

    <button onclick="changeMessage()">Click me</button>
    <div id="message">Your project is alive.</div>
    <code>my-first-project/index.html</code>
  </main>

  <script>
    const messages = [
      "Your project is alive.",
      "You just changed the webpage with JavaScript.",
      "Next step: build something much bigger.",
      "GitHub + code + ideas = 🚀"
    ];

    let i = 0;

    function changeMessage() {
      i = (i + 1) % messages.length;
      document.getElementById("message").textContent = messages[i];
    }
  </script>
</body>
</html>
