name: Daily Desk Desktop CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/daily-desk/**"
      - ".github/workflows/test-daily-desk.yml"
      - ".github/workflows/release-daily-desk.yml"
  pull_request:
    paths:
      - "apps/daily-desk/**"
      - ".github/workflows/test-daily-desk.yml"
      - ".github/workflows/release-daily-desk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Type-check and build macOS DMG
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/daily-desk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Check TypeScript and build frontend
        run: npm run build

      - name: Build macOS desktop bundle
        run: npm run tauri:build -- --target aarch64-apple-darwin

      - name: Upload DMG for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: DailyDesk-macOS-AppleSilicon
          path: apps/daily-desk/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
