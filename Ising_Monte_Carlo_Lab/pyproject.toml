[project]
name = "ising-monte-carlo-lab"
version = "1.0.0"
description = "Interactive 1D and 2D Ising Monte Carlo laboratory"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "pandas>=2.1,<3",
  "plotly>=5.20,<7",
  "streamlit>=1.41,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
